name: Native validation

on:
  pull_request:
    paths:
      - "rust/**"
      - "src-tauri/**"
      - "src/tauri-ui/**"
      - "tests/desktop-ui.test.cjs"
      - "tests/helpers/**"
      - "scripts/macos-local-signing.py"
      - "scripts/build-macos-clients.sh"
      - "tests/test_macos_signing.py"
      - "package.json"
      - ".github/workflows/native-validation.yml"
  push:
    branches:
      - main
      - codex/desktop-session-integration

permissions:
  contents: read

jobs:
  validate:
    name: Rust checks (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - windows-latest
          - ubuntu-22.04
    steps:
      - name: Checkout validation revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Report checked revision
        run: git rev-parse HEAD

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Report Rust compiler
        run: rustc --version

      - name: Report Cargo version
        run: cargo --version

      - name: Test macOS signing release guards
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s tests -p test_macos_signing.py -v

      - name: Validate macOS upgrade and CLI/desktop keychain sharing without UI
        if: runner.os == 'macOS'
        shell: bash
        run: |
          identity="$RUNNER_TEMP/tokenmarket-signing-fixture"
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              python3 scripts/macos-identity-probe.py "$identity" || true
            fi
            /usr/bin/security delete-keychain "$identity/signing.keychain-db" || true
            exit "$status"
          }
          trap cleanup EXIT
          python3 scripts/macos-local-signing.py --identity-dir "$identity" init
          python3 scripts/macos-local-signing.py --identity-dir "$identity" --profile production smoke

      # Keep each external command in its own step: PowerShell must not hide
      # an earlier command failure behind the exit code of a later command.
      # Subsequent checks still run after a check fails; the job remains failed.
      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/tokenmarket-core/Cargo.toml --all --check

      - name: Check terminal CLI formatting
        run: cargo fmt --manifest-path rust/tokenmarket-cli/Cargo.toml --all --check

      - name: Check desktop formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Test shared core
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path rust/tokenmarket-core/Cargo.toml --all-targets --no-fail-fast --locked

      # Opt in only on the hosted Windows runner. This writes/deletes one fake
      # .invalid fixture through the native store and reads it in a new process.
      # Do not unlock/reconfigure the OS store or provide account credentials.
      - name: Smoke test real Windows credential persistence
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: cargo test --manifest-path rust/tokenmarket-core/Cargo.toml --test native_credentials --locked -- --ignored --nocapture

      - name: Test terminal CLI compatibility
        if: ${{ !cancelled() }}
        run: cargo test --manifest-path rust/tokenmarket-cli/Cargo.toml --all-targets --locked

      - name: Check native desktop compilation
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      - name: Test desktop window lifecycle
        id: desktop-tests
        if: ${{ !cancelled() && runner.os != 'Linux' }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked


      - name: Test Windows guarded installer handoff
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --test windows_guardian --locked -- --nocapture

      - name: Diagnose Windows desktop loader
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.desktop-tests.outcome == 'failure' }}
        shell: pwsh
        run: |
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER = 'python ' + (Join-Path $env:GITHUB_WORKSPACE 'scripts/windows-import-probe.py')
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products '*' -property installationPath
          $dumpbin = Get-ChildItem "$installation\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          Get-ChildItem src-tauri/target/debug/deps/app_lib-*.exe | ForEach-Object {
            Write-Output "[DEBUG-ci-loader-20261105] Static and delay imports: $($_.FullName)"
            & $dumpbin /nologo /imports $_.FullName
          }
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked -- --nocapture
          exit $LASTEXITCODE

  desktop-ui:
    name: Desktop DOM/IPC fixtures
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout validation revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Report checked revision
        run: git rev-parse HEAD

      - name: Install Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Install pinned browser fixture library
        run: npm install --prefix "$RUNNER_TEMP/tokenmarket-ui-runtime" --no-save --package-lock=false --ignore-scripts playwright@1.61.0

      - name: Install matching Chromium and OS libraries
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/tokenmarket-ui-browsers
        run: node "$RUNNER_TEMP/tokenmarket-ui-runtime/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Test desktop DOM and native IPC contracts
        env:
          NODE_PATH: ${{ runner.temp }}/tokenmarket-ui-runtime/node_modules
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/tokenmarket-ui-browsers
        run: node --test --test-reporter=tap tests/desktop-ui.test.cjs
