name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            rust/tokenmarket-core
            rust/tokenmarket-cli
            src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Rust tests
        run: |
          cargo fmt --manifest-path rust/tokenmarket-core/Cargo.toml --all --check
          cargo test --manifest-path rust/tokenmarket-core/Cargo.toml --all-targets
          cargo test --manifest-path rust/tokenmarket-cli/Cargo.toml --all-targets
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Validate persistent macOS signing identity and keychain sharing
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          MACOS_SIGNING_CERTIFICATE_SHA1: ${{ vars.MACOS_SIGNING_CERTIFICATE_SHA1 }}
        run: python3 scripts/macos-local-signing.py --profile production --ci smoke

      - name: Build desktop installers
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: src-tauri
          tauriScript: npx --yes @tauri-apps/cli@2.12.4
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      - name: Build matching macOS CLI
        if: runner.os == 'macOS'
        run: cargo build --release --locked --manifest-path rust/tokenmarket-cli/Cargo.toml --target aarch64-apple-darwin

      - name: Sign macOS clients with the persistent shared identity and create DMG
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          MACOS_SIGNING_CERTIFICATE_SHA1: ${{ vars.MACOS_SIGNING_CERTIFICATE_SHA1 }}
        run: >-
          python3 scripts/macos-local-signing.py --profile production --ci package
          --app "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Token Market.app"
          --cli rust/tokenmarket-cli/target/aarch64-apple-darwin/release/tokenmarket
          --output dist/macos-release

      - name: Preserve desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            dist/macos-release/**
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload and verify release assets
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          import json, os, pathlib, subprocess, tarfile

          def gh(*args):
              return subprocess.check_output(["gh", *args], text=True)

          # Resolve renamed/transferred repositories before making upload requests.
          repo = gh("api", "repos/" + os.environ["GITHUB_REPOSITORY"], "--jq", ".full_name").strip()
          tag = os.environ["RELEASE_TAG"]
          assert tag.startswith("v"), "Desktop release must use a version tag"
          macos = os.environ["RUNNER_OS"] == "macOS"
          bundle = pathlib.Path("dist/macos-release") if macos else pathlib.Path("src-tauri/target/release/bundle")
          suffixes = [".dmg"] if macos else [".msi", ".exe"]
          installers = [p for p in bundle.rglob("*") if p.is_file() and p.suffix in suffixes]
          for suffix in suffixes:
              assert any(p.suffix == suffix for p in installers), "Missing installer: " + suffix
          if macos:
              app, = bundle.glob("*.app")
              archive = app.with_suffix(".app.tar.gz")
              with tarfile.open(archive, "w:gz") as output:
                  output.add(app, arcname=app.name)
              installers.append(archive)
              installers.extend(bundle.glob("tokenmarket-*-macos-*"))
              installers.append(bundle / "signing-manifest.json")
          if subprocess.run(["gh", "release", "view", tag, "--repo", repo], stdout=subprocess.DEVNULL).returncode:
              created = subprocess.run(["gh", "release", "create", tag, "--repo", repo, "--verify-tag", "--title", "Token Market " + tag, "--notes", "Desktop installers and CLI share this version."])
              if created.returncode:
                  gh("release", "view", tag, "--repo", repo)
          gh("release", "upload", tag, "--repo", repo, "--clobber", *map(str, installers))
          assets = json.loads(gh("release", "view", tag, "--repo", repo, "--json", "assets"))["assets"]
          for installer in installers:
              # GitHub normalizes spaces in uploaded asset filenames to dots.
              asset_name = installer.name.replace(" ", ".")
              assert any(a["name"] == asset_name and a["size"] == installer.stat().st_size for a in assets), "Uploaded asset not found: " + asset_name
