[package]
name = "app"
version = "1.2.0"
description = "Token Market"
authors = ["Token Market"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.90"

[features]
windows-update-fixtures = ["tauri/test"]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tauri-utils = "2"
serde_json = "1"
json-patch = "4"

[dependencies]
anyhow = "1"
flate2 = "1"
tar = "0.4"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "=2.14.1"
tokenmarket-core = { path = "../rust/tokenmarket-core" }

tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization"] }
